<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">

  <meta name="color-scheme" content="light dark">
  <title>CTRL KANB</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
