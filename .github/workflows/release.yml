name: Préparer une release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à empaqueter, par exemple v6.11.2"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  macos:
    runs-on: macos-15
    steps:
      - name: Récupérer le tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Préparer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Vérifier et construire
        run: |
          npm ci
          npm test
          npm run build

      - name: Vérifier la version et préparer le paquet
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Platforms/macOS/Resources/Info.plist)" = "$version"
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "dist/CTRL KANB.app" "release-assets/CTRL-KANB-${version}-macOS-arm64.zip"

      - name: Conserver le paquet macOS
        uses: actions/upload-artifact@v7
        with:
          name: macos-package
          path: release-assets/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Préparer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Vérifier l’interface partagée
        shell: pwsh
        run: |
          npm ci
          npm run test:static
          npm run test:ui

      - name: Vérifier et construire l’hôte Windows
        shell: pwsh
        run: |
          rustup default stable-msvc
          npm ci --prefix Platforms/Windows
          cargo fmt --manifest-path Platforms/Windows/src-tauri/Cargo.toml --check
          cargo clippy --manifest-path Platforms/Windows/src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path Platforms/Windows/src-tauri/Cargo.toml
          npm --prefix Platforms/Windows run build

      - name: Vérifier la version et collecter l’installateur
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content Platforms/Windows/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($packageVersion -ne $version -or $tauriVersion -ne $version) {
            throw "Le tag $env:RELEASE_TAG ne correspond pas aux versions du projet."
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installer = Get-ChildItem Platforms/Windows/src-tauri/target/release/bundle/nsis/*.exe -ErrorAction Stop | Select-Object -First 1
          Copy-Item $installer.FullName "release-assets/CTRL-KANB-$version-Windows-x64-setup.exe"

      - name: Conserver l’installateur Windows
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release-assets/*.exe
          if-no-files-found: error

  draft-release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Récupérer le paquet macOS
        uses: actions/download-artifact@v8
        with:
          name: macos-package
          path: release-assets

      - name: Récupérer l’installateur Windows
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: release-assets

      - name: Calculer les empreintes
        run: |
          cd release-assets
          sha256sum CTRL-KANB-* > SHA256SUMS.txt

      - name: Créer ou actualiser la release brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --generate-notes --title "CTRL KANB ${RELEASE_TAG#v}"
          fi
