[package]
name = "ctrl-kanb-windows"
version = "6.11.0"
description = "Hôte Windows de CTRL KANB"
authors = ["CTRL KANB contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "ctrl_kanb_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomic-write-file = "0.3"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
