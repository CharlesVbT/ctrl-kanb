[package]
name = "ctrl-kanb-windows"
version = "6.11.0"
description = "Hôte Windows de CTRL KANB"
authors = ["CTRL KANB contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "ctrl_kanb_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6"
atomic-write-file = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
open = "5.3"
portable-pty = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
